# Site settings
title: "While True: coffee++"
email: luciano.alves.vieira@gmail.com
author: Luciano Alves
description: >-
  Portfólio e reflexões de um engenheiro em transição para Data Science:
  Python, machine learning, matemática aplicada e computação quântica.
lang: pt-BR
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://lucianoav.github.io" # the base hostname & protocol for your site

github_username: lucianoav
linkedin_username: luciano-alves-vieira-6b33b0121

# Build settings
theme: minima
show_excerpts: true

minima:
  date_format: "%d/%m/%Y"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

permalink: /blog/:title/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png
  - scope:
      path: ""
      type: "posts"
    values:
      author: Luciano Alves

kramdown:
  input: GFM
  math_engine: mathjax
  parse_block_html: true
  hard_wrap: false

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
