<!DOCTYPE html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2a7ae2">
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <!-- CSS do tema Minima + camada própria (assets/main.scss) -->
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    {%- feed_meta -%}
    {%- seo -%}
    {%- include analytics.html -%}
  </head>
  <body>
    <!-- Cabeçalho do tema -->
    {%- include header.html -%}
    <!-- Conteúdo principal -->
    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
    <!-- Rodapé do tema -->
    {%- include footer.html -%}
  </body>
</html>
